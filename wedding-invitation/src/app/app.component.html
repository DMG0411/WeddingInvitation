<div class="landing" [class.opened]="isOpened" (click)="openEnvelope()">

  <div class="layer layer-closed">
    <img src="envelope-closed.svg" alt="Plic închis" />
  </div>

  <div class="layer layer-half">
    <img src="envelope-half-open.png" alt="Plic pe jumătate deschis" />
  </div>

  <div class="layer landing-content">
    <h1>Bun venit!</h1>
    <p>Aici pui textul / formularul / butoanele.</p>
    <button>Continuă</button>
  </div>

</div>
